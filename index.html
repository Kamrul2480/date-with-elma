<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Website ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="emoji" id="emoji">💌</div>
      <div class="page-count" id="pageCount">1 / 5</div>
      <h1 id="question">Hi Elma, can I tell you something?</h1>
      <p class="subtext" id="subtext">Just one little question... 😊</p>

      <div class="buttons" id="buttons">
        <button class="yes" id="yesBtn">Yes ❤️</button>
        <button class="no" id="noBtn">No 🙈</button>
      </div>

      <!-- সহজ ডেট ও টাইম ড্রপডাউন সেকশন -->
      <div class="date-picker-container hidden" id="datePickerContainer">
        <label for="dateInput">তারিখ সিলেক্ট করুন:</label>
        <input type="date" id="dateInput" class="picker-input">

        <label for="timeSelect">সময় সিলেক্ট করুন:</label>
        <select id="timeSelect" class="picker-input">
          <option value="">সময় বেছে নিন... ⏰</option>
          <option value="12:00 PM (দুপুর)">12:00 PM (দুপুর)</option>
          <option value="01:00 PM (দুপুর)">01:00 PM (দুপুর)</option>
          <option value="02:00 PM (দুপুর)">02:00 PM (দুপুর)</option>
          <option value="03:00 PM (বিকাল)">03:00 PM (বিকাল)</option>
          <option value="04:00 PM (বিকাল)">04:00 PM (বিকাল)</option>
          <option value="05:00 PM (বিকাল)">05:00 PM (বিকাল)</option>
          <option value="06:00 PM (সন্ধ্যা)">06:00 PM (সন্ধ্যা)</option>
          <option value="07:00 PM (সন্ধ্যা)">07:00 PM (সন্ধ্যা)</option>
          <option value="08:00 PM (রাত)">08:00 PM (রাত)</option>
          <option value="09:00 PM (রাত)">09:00 PM (রাত)</option>
        </select>

        <button id="confirmDateBtn" class="yes confirm-btn">Confirm Date ❤️</button>
      </div>

      <p class="message" id="message"></p>
      
      <!-- পার্সোনাল ফুটার -->
      <p class="custom-credit">Coded line by line with ❤️ by [KAMRUL] only for Elma</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
